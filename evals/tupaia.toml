# Tupaia (beyondessential/tupaia) retrieval questions, written and verified against a real
# checkout by exploring the repo (not derived from real user queries). Paths below are
# relative to the Tupaia repo root, not this one — run against a namespace indexed from
# https://github.com/beyondessential/tupaia.

[[questions]]
id = "monorepo-layout"
question = "This looks like a big monorepo — what are the different kinds of packages here (apps vs backends vs libraries) and how do they relate?"
files = ["README.md"]

[[questions]]
id = "external-data-import"
question = "Where's the code that pulls health data in from different external systems like DHIS2, KoBoToolbox or weather feeds into one common format?"
files = ["packages/data-broker/src/DataBroker/DataBroker.ts"]

[[questions]]
id = "report-data-fetching"
question = "If a report needs to query different kinds of underlying data (raw SQL, entities, survey responses, analytics), how does it decide which data-fetching logic to use?"
files = ["packages/data-table-server/src/dataTableService/getDataTableService.ts"]

[[questions]]
id = "permission-check"
question = "Once a user is logged in, how does the code actually check if they're allowed to see a particular entity or do something at a certain permission level?"
files = ["packages/access-policy/src/AccessPolicy.js"]

[[questions]]
id = "permission-group-hierarchy"
question = "Permission groups seem to nest inside each other — where does the code actually expand a user's permission group assignments up through that hierarchy?"
files = ["packages/auth/src/buildAccessPolicy.js"]

[[questions]]
id = "survey-response-model"
question = "When someone submits a filled-out survey, what does that response record look like and what other things is it linked to (user, entity, answers)?"
